name: Publish (verified, with provenance)

# n8n VERIFIED community nodes must be published from CI with an npm provenance
# statement (post-2026-05-01 requirement) — a local `npm publish` is rejected.
# This workflow publishes with --provenance, which requires `id-token: write`
# so npm can mint the OIDC-signed provenance attestation on GitHub Actions.
#
# Trigger: publish a GitHub Release (recommended), or run manually.
#
# AUTH IS OIDC, NOT A TOKEN. npm Trusted Publishing exchanges the Actions OIDC
# token for publish rights, so no NPM_TOKEN is passed to the publish step. A
# token supplied alongside Trusted Publishing can take precedence over the OIDC
# exchange, which is the failure this avoids: the publish succeeds on the token
# and the trusted-publisher path is never exercised, so nobody finds out it was
# misconfigured until the token is rotated away.
#
# The NPM_TOKEN repo secret is deliberately LEFT IN PLACE, unreferenced, as the
# way back if a trusted publish fails. Delete it only after one has succeeded.
#
# Requires npm >= 11.5.1 and Node >= 22.14.0. Node 22 ships npm 10.9.8 (checked
# against nodejs.org/dist/index.json), which is below that floor, so npm is
# upgraded in its own step before the publish rather than assumed.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED for npm provenance (OIDC)

jobs:
  publish:
    name: Build + publish to npm with provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles 10.9.8. Printed
      # before and after so a failed publish can be told apart from a Node image
      # that quietly changed what it ships.
      - name: Upgrade npm for Trusted Publishing
        run: |
          echo "node $(node --version), npm $(npm --version) as shipped"
          npm install -g npm@latest
          echo "npm $(npm --version) after upgrade"
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && ($2 < 5 || ($2 == 5 && $3 < 1)))) { print "npm " $0 " is below the 11.5.1 Trusted Publishing floor"; exit 1 } }'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Build (tsc + icons)
        run: npm run build
      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
